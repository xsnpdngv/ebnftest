<!DOCTYPE html>
<html>
  <head>
    <title>EBNF-Eval</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css"/>
    <link rel="stylesheet" type="text/css" href="css/ebnf.css"/>
    <link rel="icon" href="img/check2-circle.svg">
  </head>
  <body>

    <nav class="navbar bg-light navbar-expand-md navbar-expand-lg navbar-expand-xl navbar-expand-xxl rounded fixed-top ps-2 pe-2 pt-1" data-bs-theme="light">
    <div class="container-fluid justify-content-start" id="toolbar">
        <ul class="navbar-nav col-lg-7 col-xl-6 col-xxl-5 justify-content-start align-items-center">
        <a class="navbar-brand pt-0 pb-0" id="navbarBrand" href="">EBNF-Eval</a>
    </div>
    </nav>

    <div id="content">
      <h3>Grammar</h3>
      <textarea class="valid" id="grammar" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
function-name ::= letter (letter | digit | '_')*
letter        ::= #'[A-Za-z]'
digit         ::= #'[0-9]'
      </textarea>
      <h3>Test Input</h3>
      <textarea class="valid" id="input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">check_input_against_ENBF_1</textarea>
      <pre id="output" class="disabled"></pre>
      <script src="js/ebnftest.js" type="text/javascript"></script>
    </div>
  </body>
</html>
